<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSSFontFace Exploit Host</title>
  <link rel="stylesheet" href="includes/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="bg-glow"></div>

  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <span class="status-dot"></span>
        <h1>CSSFontFace Exploit PS4 6.00-11.02</h1>
      </div>
      <div class="ua-badge">
        <span class="badge-title">SYSTEM INFO</span>
        <span id="UA" class="badge-content">Running on:</span>
      </div>
    </header>

    <div class="control-panel">
      <div class="panel-section">
        <span class="section-label">KERNEL EXPLOIT CHAIN</span>
        <form id="kernel-options" class="segmented-control">
          <label class="segment-option" for="netctrl-exploit">
            <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
            <span class="segment-btn">NetCtrl</span>
          </label>
          
          <label class="segment-option" for="lapse-exploit">
            <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
            <span class="segment-btn">Lapse</span>
          </label>
        </form>
      </div>

      <div class="panel-divider"></div>

      <div class="panel-section action-section">
        <button id="jeilbrek" class="glow-button">
          <span>JEILBREK</span>
        </button>
        
        <div class="switch-control">
          <span class="switch-state">OFF</span>
          <label class="toggle-switch">
            <input id="autoJbInput" type="checkbox">
            <span class="toggle-slider"></span>
          </label>
          <span id="autoJbLabel" class="switch-title">Auto Jailbreak</span>
        </div>
      </div>
    </div>

    <main class="dashboard-grid">
      <div class="card avatar-card">
        <div class="avatar-wrapper">
          <img src="includes/joystick.png" alt="joystick for game enjoy">
          <div class="avatar-overlay"></div>
        </div>
      </div>

      <div class="card console-card">
        <div class="console-header">
          <div class="window-dots">
            <span></span><span></span><span></span>
          </div>
          <span class="console-title">TERMINAL OUTPUT</span>
        </div>
        <div class="console-body">
          <pre id="console">Ready. Awaiting execution...</pre>
        </div>
      </div>
    </main>
  </div>

  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>
</body>
</html>
